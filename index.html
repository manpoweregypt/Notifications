<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Manpower Egypt</title>

<style>
body {
    font-family: Segoe UI;
    margin: 0;
    background: #f8f9fc;
    display: inline-block;
}

/* HEADER */
.header {
    background: #f8f9fc;
    color: #3e5aae;
    padding: 18px 20px;
    font-size: 28px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 12px;
}

/* LOGO */
.logo {
    height: 40px;
    width: auto;
    display: none; /* will show only if src exists */
}


/* CARD */
.card {
    background: white;
    margin: 80px 250px;
    width: fit-content;
    max-width: 700px;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0px 3px 10px rgba(0,0,0,0.1);
}

/* TITLE */
.title {
    font-size: 30px;
    font-weight: bold;
    color: #3e5aae;
}

/* MESSAGE */
.message {
    margin-top: 15px;
    font-size: 22px;
    color: #444;
    line-height: 1.6;
}

/* BUTTON */
.button {
    margin-top: 25px;
    background: #0078D4;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.button:hover {
    background: #005A9E;
}

/* FOOTER */
.footer {
    margin-top: 20px;
    font-size: 11px;
    color: gray;
}
</style>
</head>
